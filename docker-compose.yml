services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: askboard
      POSTGRES_PASSWORD: askboard
      POSTGRES_DB: askboard
    ports:
      - "5433:5432"   # 5433 on the host to avoid clashing with a local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U askboard -d askboard"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://askboard:askboard@db:5432/askboard
      AUTO_MIGRATE: "true"
      CORS_ORIGINS: http://localhost:5173
      LOG_FORMAT: text
      # LLM for questions; read from the host env or a .env file next to this compose file
      LLM_PROVIDER: ${LLM_PROVIDER:-openrouter}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-4o-mini}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
